services:
  - type: web
    name: autoescrow-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AUTOESCROW_ENVIRONMENT
        value: production
      - key: AUTOESCROW_DEBUG
        value: "false"
      - key: AUTOESCROW_DEMO_CREDIT_ENABLED
        value: "false"
      - key: AUTOESCROW_LOG_LEVEL
        value: INFO
      - key: AUTOESCROW_LOG_JSON
        value: "true"
      - key: AUTOESCROW_DATABASE_URL
        sync: false
      - key: AUTOESCROW_REDIS_URL
        fromService:
          name: autoescrow-redis
          type: keyvalue
          property: connectionString
      - key: AUTOESCROW_JWT_SECRET
        generateValue: true
      - key: AUTOESCROW_ETHEREUM_CHAIN_ID
        value: "11155111"
      - key: AUTOESCROW_SIWE_DOMAIN
        sync: false
      - key: AUTOESCROW_SIWE_URI
        sync: false
      - key: AUTOESCROW_CORS_ALLOWED_ORIGINS
        value: '["https://autoescrowfrontend.vercel.app"]'
      - key: AUTOESCROW_SIWE_STATEMENT
        value: Sign in to AutoEscrow.
  - type: keyvalue
    name: autoescrow-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
