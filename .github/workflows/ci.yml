name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoescrow
          POSTGRES_PASSWORD: autoescrow
          POSTGRES_DB: autoescrow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoescrow -d autoescrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTOESCROW_ENVIRONMENT: test
      AUTOESCROW_LOG_LEVEL: INFO
      AUTOESCROW_LOG_JSON: "true"
      AUTOESCROW_DATABASE_URL: postgresql+asyncpg://autoescrow:autoescrow@127.0.0.1:5432/autoescrow_test
      AUTOESCROW_REDIS_URL: redis://127.0.0.1:6379/15
      AUTOESCROW_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
      AUTOESCROW_ETHEREUM_CHAIN_ID: "11155111"
      AUTOESCROW_SIWE_DOMAIN: localhost:8000
      AUTOESCROW_SIWE_URI: http://localhost:8000

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for model/schema drift
        run: alembic check

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        env:
          AUTOESCROW_JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build --tag autoescrow-backend:ci ./backend
