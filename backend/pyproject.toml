[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoescrow-backend"
dynamic = ["version"]
description = "AutoEscrow trust, verification and settlement backend"
requires-python = ">=3.12"
dependencies = [
    # siwe 4.4.0 currently fails to import with abnf>=2.9; pin the last compatible release.
    "abnf==2.8.3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "eth-account>=0.13,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.10,<3",
    "redis>=5.2,<6",
    "siwe>=4.4,<5",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoescrow"]

[tool.hatch.version]
path = "src/autoescrow/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
mypy_path = "typings"
